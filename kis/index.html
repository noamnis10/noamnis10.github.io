<html lang="he" dir="rtl">
<head>

<style>
/* VOICE: calm, honest, reassuring money tool for a worried student
   IDEA: a pocket — one big number on a colour field that tells you, at a glance, if you're ok
   PICTURE: the hero field with today's number + a "runway" chart of projected balance to zero
   COLOUR and TYPE: black and white plus one status field (mint ok, yellow careful, coral stop); Rubik
   LAYOUT: phone-first app: header, hero, cards stack, bottom tab bar with a central add button */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c0e0d);--ink:light-dark(#0e1110,#f1f4f2);--mute:light-dark(#5b645f,#9ca59f);
--line:light-dark(#e4e9e6,#252a28);--card:light-dark(#f3f6f4,#161a18);--card2:light-dark(#ffffff,#1d2220);
--ok:light-dark(#b8f5d0,#123321);--okInk:light-dark(#08391f,#b8f5d0);
--warn:light-dark(#ffd84a,#3a3008);--warnInk:light-dark(#3d3000,#ffd84a);
--bad:light-dark(#ffad9f,#3d1610);--badInk:light-dark(#4a1007,#ffb3a6);
--accent:light-dark(#0e1110,#b8f5d0);--onAccent:light-dark(#ffffff,#08391f);
--red:light-dark(#c2321e,#ff8f7d);--green:light-dark(#0b7a43,#7ee3a8);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Rubik,"Segoe UI",Arial,sans-serif;overflow-x:clip;padding-bottom:calc(92px + var(--sb))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{unicode-bidi:isolate;direction:ltr;display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:calc(14px + var(--st)) 16px 6px;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:20px;letter-spacing:-.01em}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.l{background:#d9a400}.dot.s{background:var(--mute)}
.hero{margin:8px 0 14px;border-radius:24px;padding:20px 20px 18px;background:var(--ok);color:var(--okInk)}
.hero.warn{background:var(--warn);color:var(--warnInk)}.hero.bad{background:var(--bad);color:var(--badInk)}
.hero .lbl{font-size:15px;font-weight:500}
.big{font-size:clamp(52px,17vw,76px);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin:2px 0 4px}
.hero .sub{font-size:14px}
.bar{height:8px;border-radius:4px;background:color-mix(in srgb,currentColor 16%,transparent);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;border-radius:4px;background:currentColor;transition:width .4s}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.tile{background:var(--card);border-radius:18px;padding:14px}
.tile .k{font-size:13px;color:var(--mute)}.tile .v{font-size:21px;font-weight:700;margin-top:2px}
.tile .h{font-size:12px;color:var(--mute);margin-top:2px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-size:13px;color:var(--mute);font-weight:400}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1}.row .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:13px;color:var(--mute)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--card2)}
.ic svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.amt{font-weight:500}.amt.in{color:var(--green)}
.note{font-size:14px;color:var(--mute);margin:4px 0 0}
.alert{border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.alert.y{background:var(--warn);color:var(--warnInk)}.alert.r{background:var(--bad);color:var(--badInk)}.alert.g{background:var(--ok);color:var(--okInk)}
.alert .t{flex:1;font-size:15px}.alert b{font-weight:500}
.btn{min-height:44px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--onAccent);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.g{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.sticky{position:sticky;bottom:calc(-18px - var(--sb));background:var(--bg);padding:10px 0 calc(18px + var(--sb));margin:0 0 calc(-18px - var(--sb))}
.btn.s{min-height:36px;padding:0 12px;border-radius:11px;font-size:14px}
.btn.full{width:100%}.btn.d{background:var(--red);color:#fff}
.alert.y .btn{background:var(--warnInk);color:var(--warn)}.alert.r .btn{background:var(--badInk);color:var(--bad)}.alert.g .btn{background:var(--okInk);color:var(--ok)}
.fig{position:relative;height:150px;margin-top:6px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.lnk{color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px}
h2.sec{font-size:22px;margin:10px 0 12px;font-weight:700}
.empty{color:var(--mute);font-size:15px;padding:6px 0}
nav{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sb));z-index:20}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
nav button.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);min-height:50px;justify-content:center}
nav button.tab svg{width:24px;height:24px}
nav button.tab[aria-current=page]{color:var(--ink);font-weight:500}
.fab{width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--onAccent);display:grid;place-items:center;margin:-22px auto 0}
.fab svg{width:30px;height:30px;stroke-width:2.4}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(18px + var(--sb));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h4{margin:0 0 12px;font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.x{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.seg{display:flex;background:var(--card);border-radius:13px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:15px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.amtbox{text-align:center;font-size:48px;font-weight:700;padding:0;letter-spacing:-.02em;min-height:62px;line-height:62px}
.amtbox.z{color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;background:var(--card);font-size:12px;min-height:64px;border:2px solid transparent}
.cat svg{width:22px;height:22px}
.cat[aria-pressed=true]{border-color:var(--accent);background:var(--card2);font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 12px;direction:ltr}
.pad button{min-height:48px;border-radius:14px;background:var(--card);font-size:24px;font-weight:500}
.pad button:active{background:var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{min-height:36px;padding:0 12px;border-radius:18px;background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--onAccent)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.inp{width:100%;min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px}
.toast{position:fixed;inset:auto 12px calc(96px + var(--sb)) 12px;max-width:520px;margin:0 auto;z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast .t{flex:1;font-size:15px}.toast button{color:var(--bg);font-weight:700;text-decoration:underline;min-height:36px;padding:0 6px}
.search{margin-bottom:10px}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:12px 4px 4px}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--mute);white-space:nowrap}
.ob{padding:calc(30px + var(--st)) 0 30px}
.ob h1{font-size:34px;line-height:1.08;margin:8px 0 10px;text-wrap:balance}
.ob p{color:var(--mute);margin:0 0 20px}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--accent)}
textarea.inp{min-height:110px;padding:12px;font-size:14px;resize:vertical}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header id="hdr" class="hide"><div class="logo">כיס</div><div class="sync" id="sync"><i class="dot s"></i><span>טוען…</span></div></header>
<main class="wrap" id="app"><div class="ob"><p>טוען…</p></div></main>
<nav id="nav" class="hide" aria-label="ניווט">
 <div class="in">
  <button class="tab" data-v="home"><svg class="i"><use href="#i-home"/></svg>בית</button>
  <button class="tab" data-v="list"><svg class="i"><use href="#i-list"/></svg>תנועות</button>
  <button class="fab" id="fab" aria-label="הוספת הוצאה"><svg class="i"><use href="#i-plus"/></svg></button>
  <button class="tab" data-v="plan"><svg class="i"><use href="#i-cal"/></svg>תכנון</button>
  <button class="tab" data-v="more"><svg class="i"><use href="#i-more"/></svg>עוד</button>
 </div>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"><div class="t" id="toastT"></div><button id="toastB" class="hide">ביטול</button></div>

<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((+x||0)*100)/100;
const pad2=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const todayS=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((Date.UTC(...ymd(b))-Date.UTC(...ymd(a)))/864e5);
function ymd(s){const[a,b,c]=s.split('-').map(Number);return[a,b-1,c]}
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function onDay(y,m,day){if(m>11){y+=Math.floor(m/12);m%=12}return y+'-'+pad2(m+1)+'-'+pad2(Math.min(day,dim(y,m)))}
const addM=(s,n,day)=>{const[y,m,d]=ymd(s);return onDay(y,m+n,day??d)};
const mk=s=>s.slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nf=new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
function money(x,dec){const v=r2(x),s=v<0?'−':'',a=Math.abs(v),d=dec&&a%1>0.001;return '<span class="n">'+s+'₪'+(d?nf2.format(a):nf.format(Math.round(a)))+'</span>'}
const plain=x=>(x<0?'−':'')+'₪'+nf.format(Math.abs(Math.round(x)));
const dfmt=s=>pd(s).toLocaleDateString('he-IL',{day:'numeric',month:'short'});
const dlong=s=>pd(s).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
const icon=(id,c)=>'<svg class="i"'+(c?' style="color:'+c+'"':'')+'><use href="#i-'+id+'"/></svg>';
const parseAmt=v=>{const s=String(v??'').replace(/[₪,\s]/g,'').replace('−','-');if(!s)return NaN;const n=Number(s);return isFinite(n)?n:NaN};
const clone=o=>JSON.parse(JSON.stringify(o));

const CATS=[
 {id:'food',n:'אוכל בחוץ',i:'food',c:'#e8743b'},{id:'super',n:'סופר',i:'super',c:'#2f9e62'},
 {id:'bus',n:'תחבורה',i:'bus',c:'#3a7bd5'},{id:'fun',n:'בילויים',i:'fun',c:'#b05cc9'},
 {id:'study',n:'לימודים',i:'study',c:'#6b6fd6'},{id:'shop',n:'קניות',i:'shop',c:'#d4527e'},
 {id:'fuel',n:'דלק ורכב',i:'fuel',c:'#8a6d1d'},{id:'health',n:'בריאות',i:'health',c:'#d63c3c'},
 {id:'subs',n:'מינויים',i:'subs',c:'#1d9e9e'},{id:'house',n:'דירה',i:'house',c:'#7a5c3e'},
 {id:'other',n:'אחר',i:'other',c:'#7c8580'}];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const INCAT={n:'הכנסה',i:'in',c:'#0b7a43'};

/* ---------- state ---------- */
const DEF=()=>({v:1,setup:false,anchor:{bal:0,at:0},overdraft:0,cushion:300,billDay:10,target:'',alertDays:21,
 bills:[],incomes:[],sinks:[],vouchers:[],debts:[],log:[],skip:[],recent:[]});
let S=DEF(), M={};            // M: {'2026-11':[tx,...]}
let view='home', q='';
let mode='init';               // init | cloud | local
const LS='kis.v1';
let idb=null;
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open('kis',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
function idbPut(v){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').put(v,'state')}catch(e){}}
function idbGet(){return new Promise(r=>{if(!idb)return r(null);try{const q=idb.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
let saveOk=true;
function lsSave(){const v=JSON.stringify({S,M});try{localStorage.setItem(LS,v);saveOk=true}catch(e){saveOk=false}clearTimeout(lsSave.t);lsSave.t=setTimeout(()=>idbPut(v),300);setSync()}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o&&o.S){S=Object.assign(DEF(),o.S);M=o.M||{};return true}}catch(e){}return false}
const allTx=()=>Object.values(M).flat();
function touch(){lsSave()}
function setSync(){const el=$('#sync');if(!el)return;el.innerHTML=saveOk?'<i class="dot"></i><span>נשמר בטלפון</span>':'<i class="dot l"></i><span>לא נשמר! צור גיבוי</span>'}

/* ---------- money engine ---------- */
function chargeDates(t){ // card purchase -> [{d,amt,i}]
 const n=Math.max(1,t.n||1),base=Math.floor(t.amt/n*100)/100,out=[];
 const[y,m]=ymd(t.d);
 for(let i=0;i<n;i++){const a=i===n-1?r2(t.amt-base*(n-1)):base;out.push({d:onDay(y,m+1+i,S.billDay),amt:a,i})}
 return out;
}
function balanceNow(T){
 const aDay=S.anchor.at?ds(new Date(S.anchor.at)):'0000-00-00';let b=S.anchor.bal;
 for(const t of allTx()){
  if(t.m==='card'&&t.t==='exp'){for(const c of chargeDates(t))if(c.d>aDay&&c.d<=T)b-=c.amt}
  else if(t.d>aDay||(t.d===aDay&&(t.c||0)>S.anchor.at))b+=t.t==='inc'?t.amt:-t.amt;
 }
 return r2(b);
}
function pendingCharges(T){const out=[];for(const t of allTx())if(t.m==='card'&&t.t==='exp')for(const c of chargeDates(t))if(c.d>T)out.push({...c,tx:t});return out}
function billDates(b,from,to){const out=[];const[y,m]=ymd(from);for(let k=0;k<15;k++){const d=onDay(y,m+k,b.day);if(d>to)break;if(d>=from)out.push(d)}return out}
function incDates(inc,from,to){const out=[];let d=inc.date;let g=0;while(d<=to&&g<400){if(d>=from)out.push(d);if(!inc.repeat)break;d=addM(inc.date,++g,+inc.date.slice(8));}return out}
function sinkSaved(s,T,extra){const sv=Math.min(+s.saved||0,s.amt),from=s.from||T,tot=Math.max(1,diffD(from,s.due));return sv+(s.amt-sv)*Math.min(1,Math.max(0,(diffD(from,T)+(extra||0))/tot))}
const isDisc=t=>t.t==='exp'&&!(t.src||'').startsWith('bill:')&&t.src!=='opening';
function compute(){
 const T=todayS();
 const bal=balanceNow(T);
 const nextInc=S.incomes.filter(i=>i.date>T).map(i=>i.date).sort()[0];
 const dueInc=S.incomes.filter(i=>i.date<=T);
 let H=nextInc||(S.target&&S.target>T?S.target:addD(T,30));
 const hKind=nextInc?'inc':(S.target&&S.target>T?'target':'auto');
 const daysLeft=Math.max(1,diffD(T,H));
 const pend=pendingCharges(T);
 const pendRes=pend.filter(c=>c.d<=H||c.i===0).reduce((a,c)=>a+c.amt,0);
 let billRes=0;for(const b of S.bills)billRes+=billDates(b,addD(T,1),addD(H,-1)).length*b.amt;
 let sinkRes=0;for(const s of S.sinks)sinkRes+=s.due<=H?s.amt:sinkSaved(s,T,diffD(T,H));
 const oweRes=S.debts.filter(d=>d.dir==='owe').reduce((a,d)=>a+d.amt,0);
 const reserved=r2(pendRes+billRes+sinkRes+oweRes+(+S.cushion||0));
 const avail=r2(bal-reserved);
 const todays=allTx().filter(t=>t.d===T&&isDisc(t));
 const eff=t=>t.m==='card'&&(t.n||1)>1?chargeDates(t).filter(c=>c.d<=H||c.i===0).reduce((a,c)=>a+c.amt,0):t.amt;
 const spentToday=r2(todays.reduce((a,t)=>a+eff(t),0));
 const pool=avail+spentToday;
 const daily=pool>0?pool/daysLeft:0;
 const safe=Math.max(0,daily-spentToday);
 // average discretionary spend, last 28 days
 const from=addD(T,-27);const disc=allTx().filter(t=>isDisc(t)&&t.d>=from&&t.d<=T);
 const firstD=allTx().filter(isDisc).map(t=>t.d).sort()[0];
 const span=firstD?Math.min(28,diffD(firstD<from?from:firstD,T)+1):0;
 const avgReal=span>=3?disc.reduce((a,t)=>a+t.amt,0)/span:null;
 const avg=avgReal??daily;
 const run=sim(T,bal,avg,pend);
 const runDays=run.idx<0?null:run.idx;
 let st='ok';
 if(bal<0||avail<=0||(runDays!==null&&runDays<S.alertDays))st='bad';
 else if((runDays!==null&&runDays<S.alertDays*2)||safe<daily*.25)st='warn';
 return {T,bal,H,hKind,daysLeft,pend,pendRes,billRes,sinkRes,oweRes,reserved,avail,spentToday,daily,safe,avg,avgReal,run,runDays,st,dueInc,nextInc};
}
function sim(T,bal,avg,pend,cut){
 const N=365,ev={};const add=(d,v)=>{ev[d]=(ev[d]||0)+v};const end=addD(T,N);const st=addD(T,1);
 for(const i of S.incomes)if(i.date>T)for(const d of incDates(i,st,end))add(d,i.amt);
 for(const b of S.bills)for(const d of billDates(b,st,end))add(d,-b.amt);
 for(const c of pend)add(c.d,-c.amt);
 for(const s of S.sinks){let d=s.due;for(let k=0;k<3&&d<=end;k++){if(d>=st)add(d,-s.amt);d=addM(s.due,12*(k+1))}}
 let b=bal-S.debts.filter(d=>d.dir==='owe').reduce((a,d)=>a+d.amt,0);const pts=[{d:T,b}];let idx=b<0?0:-1;let d=T;
 const a=Math.max(0,avg-(cut||0));
 for(let k=1;k<=N;k++){d=addD(d,1);b+=(ev[d]||0)-a;pts.push({d,b});if(idx<0&&b<0)idx=k}
 return {pts,idx};
}

/* ---------- auto-post bills, roll sinks ---------- */
function housekeep(){
 const T=todayS();const ch=new Set();
 for(const b of S.bills){
  const start=b.start||T;
  for(const d of billDates(b,start.slice(0,8)+'01',T)){
   if(d<start)continue;
   const id='b_'+b.id+'_'+d.slice(0,7);
   if(S.skip.includes(id))continue;
   const m=mk(d);M[m]=M[m]||[];
   if(!M[m].some(t=>t.id===id)){M[m].push({id,d,amt:b.amt,t:'exp',m:b.method==='card'?'card':'now',cat:b.cat||'subs',note:b.name,n:1,c:new Date(d+'T08:00').getTime(),src:'bill:'+b.id});ch.add('tx-'+m)}
  }
 }
 let sc=false;for(const s of S.sinks){let g=0;if(!s.from){s.from=T;sc=true}while(s.due<T&&g++<5){s.from=s.due;s.saved=0;s.due=addM(s.due,12);sc=true}}
 if(S.skip.length>200){S.skip=S.skip.slice(-200);sc=true}
 if(sc)ch.add('settings');
 if(ch.size)touch([...ch]);
}

function nextBill(T){const[y,m,d]=ymd(T);return d<S.billDay?onDay(y,m,S.billDay):onDay(y,m+1,S.billDay)}
function weekLine(T){
 const w=allTx().filter(t=>isDisc(t)&&t.d>addD(T,-7)&&t.d<=T),p=allTx().filter(t=>isDisc(t)&&t.d>addD(T,-14)&&t.d<=addD(T,-7));
 if(!w.length)return 'עוד לא נרשמו הוצאות השבוע. כל הוצאה שתרשום תשפר את הדיוק.';
 const sum=w.reduce((a,t)=>a+t.amt,0),ps=p.reduce((a,t)=>a+t.amt,0);
 const by={};for(const t of w)by[t.cat]=(by[t.cat]||0)+t.amt;const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
 let s='ב-7 הימים האחרונים הוצאת '+money(sum)+', הכי הרבה על '+esc(CAT[top[0]]?.n||'אחר')+' ('+money(top[1])+').';
 if(ps>0){const ch=Math.round((sum-ps)/ps*100);s+=ch>5?' זה '+ch+'% יותר מהשבוע שלפני.':ch<-5?' זה '+(-ch)+'% פחות מהשבוע שלפני. יפה.':' בערך כמו השבוע שלפני.'}
 return s;
}
function drawRun(c){
 const box=$('#fig');if(!box)return;const s=box.querySelector('svg');
 const n=c.runDays===null?60:Math.min(365,Math.max(30,c.runDays+14));
 const pts=c.run.pts.slice(0,n+1);
 const draw=()=>{
  const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const vals=pts.map(p=>p.b);let hi=Math.max(...vals,0),lo=Math.min(...vals,0);if(hi===lo)hi=lo+1;
  const pl=8,pr=8,pt=18,pb=22;
  const X=i=>W-pr-(i/n)*(W-pl-pr); // RTL: today on the right
  const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.b).toFixed(1)).join('');
  const area=line+'L'+X(n).toFixed(1)+' '+Y(0).toFixed(1)+'L'+X(0).toFixed(1)+' '+Y(0).toFixed(1)+'Z';
  const col=c.st==='bad'?'var(--red)':c.st==='warn'?'#c99700':'var(--green)';
  s.style.direction='ltr';let g='<path d="'+area+'" fill="'+col+'" opacity=".12"/><path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round"/>';
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="currentColor" opacity=".25" stroke-dasharray="3 4"/>';
  g+='<text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="12" fill="currentColor" opacity=".6" text-anchor="end">היום</text>';
  g+='<text x="'+pl+'" y="'+(H-6)+'" font-size="12" fill="currentColor" opacity=".6" text-anchor="start">'+esc(dfmt(pts[n].d))+'</text>';
  if(c.runDays!==null&&c.runDays<=n){const x=X(c.runDays);g+='<line x1="'+x+'" x2="'+x+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--red)" stroke-width="1.5"/><circle cx="'+x+'" cy="'+Y(0)+'" r="4" fill="var(--red)"/>';
   const lab='אפס ב-'+dfmt(addD(c.T,c.runDays));const tx=Math.min(W-pr-4,Math.max(pl+60,x));g+='<text x="'+tx+'" y="12" font-size="12" fill="var(--red)" text-anchor="middle">'+esc(lab)+'</text>'}
  else g+='<text x="'+(W/2)+'" y="12" font-size="12" fill="currentColor" opacity=".6" text-anchor="middle">שיא '+esc(plain(hi))+'</text>';
  s.setAttribute('viewBox','0 0 '+W+' '+H);s.innerHTML=g;
 };
 if(roHome)roHome.disconnect();roHome=new ResizeObserver(draw);roHome.observe(s);draw();
}

 sh.innerHTML='<div class="grab"></div>'+html;sh.scrollTop=0;sh.hidden=false;sc.hidden=false;$('#toast').classList.remove('on');

function closeSheet(){
 const sh=$('#sheet'),sc=$('#scrim');sh.classList.remove('on');sc.classList.remove('on');document.body.style.overflow='';
 setTimeout(()=>{if(!sh.classList.contains('on')){sh.hidden=true;sc.hidden=true;sh.innerHTML=''}},260);

 t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.classList.remove('on');undoFn=null},undo?6000:3500);
}

function withUndo(msg,fn){
 const bS=clone(S),bM=clone(M);fn();

 toast(msg,()=>{S=bS;M=bM;touch(keys);render()});
}

function receiveIncome(id){

  if(i.repeat){const day=+i.date.slice(8);let k=1,nd=addM(i.date,1,day);while(nd<=T&&k<24)nd=addM(i.date,++k,day);i.date=nd}else S.incomes=S.incomes.filter(x=>x.id!==id);
 });
}

function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='lib/xlsx.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej();s.onerror=rej;document.head.appendChild(s)})}
const KW=[['super',/שופרסל|רמי לוי|ויקטורי|יוחננוף|אושר עד|טיב טעם|מגה|חצי חינם|יינות ביתן|am:?pm|סופר(?! ?פארם)|קשת טעמים|פרש מרקט|מכולת/i],['bus',/רב.?קו|רכבת|אגד|דן |מטרופולין|אפיקים|גט |gett|yango|pango|פנגו|סלופארק|חניון|חניה|מוביט|moovit|bird|lime/i],['fuel',/פז|דלק|סונול|דור אלון|ten |yellow|מוסך|טסט|רישוי/i],['subs',/spotify|ספוטיפיי|netflix|נטפליקס|apple|google|disney|youtube|yes|hot|פרטנר|סלקום|פלאפון|גולן|הוט מובייל|012|019|we4g|icloud|chatgpt|openai|anthropic|claude|amazon prime|חדר כושר|הולמס|גו אקטיב/i],['food',/וולט|wolt|תן ביס|10bis|cibus|סיבוס|קפה|ארומה|לנדוור|מקדונלד|בורגר|פיצה|שווארמה|פלאפל|מסעד|ביסטרו|בר |פאב|גרג|רולדין|נאפיס|דומינו/i],['health',/סופר.?פארם|super.?pharm|\bbe\b|מכבי|כללית|מאוחדת|לאומית|בית מרקחת|רופא|שיניים|אופטיק/i],['study',/אוניברסיט|מכללה|טכניון|סטימצקי|צומת ספרים|אגודת הסטודנטים|קורס|udemy|coursera/i],['fun',/סינמה|קולנוע|יס פלאנט|הופעה|כרטיס|tickets|eventim|לאן|זאפה|באולינג|לונה/i],['shop',/זארה|zara|h&m|קסטרו|פוקס|fox|אמריקן איגל|terminal x|טרמינל|shein|aliexpress|עלי אקספרס|ksp|באג|איקאה|ikea|אייס|הום סנטר|נייקי|אדידס|מחסני חשמל/i],['house',/חשמל|חברת החשמל|מים|ארנונה|ועד בית|גז|סופרגז|אמישראגז|bezeq|בזק/i]];
const guessCat=s=>{for(const[c,r]of KW)if(r.test(s))return c;return 'other'};
function pDate(v,X){
 if(v instanceof Date&&!isNaN(v))return ds(new Date(v.getTime()+12*3600e3));
 if(typeof v==='number'&&v>20000&&v<80000){const o=X.SSF.parse_date_code(v);return o.y+'-'+pad2(o.m)+'-'+pad2(o.d)}
 const s=String(v||'').trim();let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
 if(m){let y=+m[3];if(y<100)y+=2000;const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad2(mo)+'-'+pad2(d)}
 m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null;
}
async function importFile(f){
 let X;try{X=await loadXLSX()}catch(e){toast('לא הצלחתי לטעון את קורא הקבצים. נסה שוב.');return}
 let rows=[];
 try{const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  for(const sn of wb.SheetNames){const a=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});rows=rows.concat(parseSheet(a,X))}
 }catch(e){toast('לא הצלחתי לקרוא את הקובץ. צריך קובץ Excel או CSV.');return}
 if(!rows.length){openSheet(head('ייבוא פירוט')+'<p>לא מצאתי בקובץ עמודות של תאריך וסכום. כדאי להוריד את "פירוט חיובים" כקובץ Excel מהאתר של חברת האשראי ולנסות שוב.</p><button class="btn full" data-close>הבנתי</button>');return}
 const ex=allTx().filter(t=>t.t==='exp'&&t.src!=='opening'),used=new Set();
 const res=rows.map(r=>{const hit=ex.find(t=>!used.has(t.id)&&Math.abs(t.amt-r.amt)<=1&&Math.abs(diffD(t.d,r.d))<=3);if(hit)used.add(hit.id);return{...r,match:!!hit,cat:guessCat(r.name),pick:!hit}});
 const nw=res.filter(r=>!r.match);
 const draw=()=>head('ייבוא פירוט')
  +'<div class="duo"><div class="tile"><div class="k">כבר רשומות</div><div class="v">'+(res.length-nw.length)+'</div></div><div class="tile"><div class="k">חסרות</div><div class="v">'+nw.length+'</div></div></div>'
  +(nw.length?'<p class="note" style="margin-top:0">אלה העסקאות ששכחת לרשום. אפשר להוריד סימון ממה שלא רוצים.</p><div class="card" style="padding:4px 12px">'+nw.map((r,i)=>'<label class="row" style="cursor:pointer"><input type="checkbox" data-pi="'+i+'" '+(r.pick?'checked':'')+' style="width:22px;height:22px;flex:none"><div class="t"><b>'+esc(r.name||'עסקה')+'</b><span>'+dfmt(r.d)+' · '+esc(CAT[r.cat].n)+'</span></div><div class="amt">'+money(r.amt,1)+'</div></label>').join('')+'</div><button class="btn full" id="impgo" style="min-height:52px">הוספת '+nw.filter(r=>r.pick).length+' עסקאות</button>':'<p>הכול כבר רשום. כל הכבוד!</p><button class="btn full" data-close>סגירה</button>');
 openSheet(draw(),function w(sh){
  sh.querySelectorAll('[data-pi]').forEach(c=>c.onchange=()=>{nw[+c.dataset.pi].pick=c.checked;const b=sh.querySelector('#impgo');b.textContent='הוספת '+nw.filter(r=>r.pick).length+' עסקאות'});
  const go=sh.querySelector('#impgo');if(go)go.onclick=()=>{const pick=nw.filter(r=>r.pick);if(!pick.length){closeSheet();return}closeSheet();
   withUndo('נוספו '+pick.length+' עסקאות',()=>{for(const r of pick){const m=mk(r.d);M[m]=M[m]||[];M[m].push({id:uid(),d:r.d,amt:r.amt,t:'exp',m:'card',cat:r.cat,note:r.name.slice(0,60),n:1,c:Date.now(),src:'imp'})}})};
 });
}
function parseSheet(a,X){
 let hi=-1,cD=-1,cN=-1,cA=-1;
 for(let i=0;i<Math.min(a.length,40);i++){const r=a[i].map(x=>String(x||'').trim());
  const d=r.findIndex(x=>/תאריך/.test(x)&&!/חיוב/.test(x)),d2=r.findIndex(x=>/תאריך/.test(x));
  const am=r.findIndex(x=>/סכום ה?חיוב|סכום לחיוב/.test(x)),am2=r.findIndex(x=>/סכום/.test(x));
  if((d>=0||d2>=0)&&(am>=0||am2>=0)){hi=i;cD=d>=0?d:d2;cA=am>=0?am:am2;cN=r.findIndex(x=>/בית ה?עסק|שם העסק|תיאור|פירוט|עסקה$/.test(x)&&!/תאריך|סכום|סוג/.test(x));break}}
 if(hi<0)return [];
 const out=[];
 for(let i=hi+1;i<a.length;i++){const r=a[i];const d=pDate(r[cD],X);let v=r[cA];v=typeof v==='number'?v:parseAmt(String(v).replace(/[^\d.\-−]/g,''));
  if(!d||!isFinite(v)||v<=0)continue;out.push({d,amt:r2(v),name:String(cN>=0?r[cN]:'').trim()})}
 return out;
}

  +'<label class="f"><span>מסגרת המינוס בחשבון (אם יש)</span><input class="inp" id="o2" inputmode="decimal" value="'+esc(ob.od)+'" placeholder="0"></label>';
 if(step===1)h+='<h1>מתי יורד חיוב האשראי?</h1><p>קניות בכרטיס יורדות מהחשבון רק ביום הזה. כיס ישמור אותן בצד עד אז.</p><div class="opts">'+[2,10,15].map(d=>'<button class="chip" data-bd="'+d+'" aria-pressed="'+(ob.bd===d)+'">'+d+' לחודש</button>').join('')+'</div><label class="f"><span>יום אחר</span><input class="inp" id="o3" inputmode="numeric" value="'+([2,10,15].includes(ob.bd)?'':ob.bd)+'" placeholder="למשל 8"></label><label class="f"><span>כמה יירד בחיוב הקרוב?</span><input class="inp" id="o8" inputmode="decimal" value="'+esc(ob.cc)+'" placeholder="0"><div class="note" style="font-size:13px">מופיע באפליקציה של חברת האשראי כ"חיוב הבא" או "חיוב צפוי". חשוב: בלי זה המספר היומי יצא גבוה מדי.</div></label>';
 if(step===2)h+='<h1>מתי נכנס הכסף הבא?</h1><p>מלגה, תגמול מילואים, משכורת. אם אין כרגע הכנסה צפויה, מדלגים.</p>'
  +'<label class="f"><span>מה</span><input class="inp" id="o5" value="'+esc(ob.incn)+'" placeholder="מלגה"></label><label class="f"><span>סכום</span><input class="inp" id="o4" inputmode="decimal" value="'+esc(ob.inc)+'" placeholder="2500"></label><label class="f"><span>תאריך</span><input class="inp" type="date" id="o6" value="'+esc(ob.incd)+'" min="'+addD(todayS(),1)+'"></label><label style="display:flex;gap:10px;align-items:center;min-height:44px;margin-bottom:12px"><input type="checkbox" id="o7" style="width:22px;height:22px"'+(ob.rep?' checked':'')+'> חוזרת כל חודש</label>';
 if(step===3)h+='<h1>כרית ביטחון</h1><p>סכום שלא נוגעים בו, למקרה חירום. הוא לא ייספר ככסף פנוי. אפשר לשנות בכל זמן.</p><div class="opts">'+['0','200','300','500','1000'].map(v=>'<button class="chip" data-cu="'+v+'" aria-pressed="'+(ob.cush===v)+'">'+plain(+v)+'</button>').join('')+'</div>';
 h+='<div class="err" id="oe"></div><div style="display:flex;gap:10px;margin-top:20px">'+(step>0?'<button class="btn g" id="ob" aria-label="חזרה">'+icon('back')+'</button>':'')+'<button class="btn" id="on" style="flex:1;min-height:52px">'+(step===steps-1?'מתחילים':'המשך')+'</button></div>'+(step===2?'<div style="text-align:center;margin-top:14px"><button class="lnk" id="skip">אין הכנסה צפויה, דלג</button></div>':'')+'</div>';
 $('#app').innerHTML=h;
 const A=$('#app');
 A.querySelectorAll('[data-neg]').forEach(b=>b.onclick=()=>{ob.bal=$('#o1').value;ob.od=$('#o2').value;ob.neg=b.dataset.neg==='1';renderOnboard(0)});
 A.querySelectorAll('[data-bd]').forEach(b=>b.onclick=()=>{ob.bd=+b.dataset.bd;renderOnboard(1)});
 A.querySelectorAll('[data-cu]').forEach(b=>b.onclick=()=>{ob.cush=b.dataset.cu;renderOnboard(3)});
 const err=t=>{$('#oe').textContent=t};
 const back=$('#ob');if(back)back.onclick=()=>renderOnboard(step-1);
 const sk=$('#skip');if(sk)sk.onclick=()=>{ob.inc='';ob.incd='';ob.incn='';renderOnboard(3)};
 $('#on').onclick=()=>{
  if(step===0){ob.bal=$('#o1').value;ob.od=$('#o2').value;const v=parseAmt(ob.bal);if(isNaN(v)||v<0)return err('מקלידים סכום, בלי מינוס (בשביל מינוס בוחרים "במינוס")');if(ob.od&&isNaN(parseAmt(ob.od)))return err('מסגרת לא תקינה');return renderOnboard(1)}
  if(step===1){const o=$('#o3').value.trim();ob.cc=$('#o8').value;if(o){const n=parseInt(o,10);if(!(n>=1&&n<=28))return err('יום בין 1 ל-28');ob.bd=n}if(ob.cc&&!(parseAmt(ob.cc)>=0))return err('סכום החיוב לא תקין');return renderOnboard(2)}
  if(step===2){ob.incn=$('#o5').value.trim();ob.inc=$('#o4').value;ob.incd=$('#o6').value;ob.rep=$('#o7').checked;
   if(ob.inc||ob.incd){const v=parseAmt(ob.inc);if(isNaN(v)||v<=0)return err('מקלידים סכום');if(!ob.incd||ob.incd<=todayS())return err('בוחרים תאריך עתידי')}return renderOnboard(3)}
  if(step===3){const T=todayS();S=Object.assign(DEF(),{setup:true,anchor:{bal:r2((ob.neg?-1:1)*parseAmt(ob.bal)),at:Date.now()},overdraft:r2(parseAmt(ob.od)||0),billDay:ob.bd,cushion:+ob.cush});
   if(ob.inc)S.incomes.push({id:uid(),name:ob.incn||'הכנסה',amt:r2(parseAmt(ob.inc)),date:ob.incd,repeat:ob.rep});
   const cc=r2(parseAmt(ob.cc)||0);if(cc>0){const nb=nextBill(T),[y,m]=ymd(nb);const d=onDay(y,m-1,1);M[mk(d)]=M[mk(d)]||[];M[mk(d)].push({id:'opening',d,amt:cc,t:'exp',m:'card',cat:'other',note:'חיוב אשראי מלפני ההתחלה',n:1,c:Date.now(),src:'opening'})}
   touch(['settings',...Object.keys(M).map(m=>'tx-'+m)]);view='home';boot();toast('מוכן! עכשיו רושמים כל הוצאה עם הכפתור +')}
 };
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-a]');if(!t)return;
 if(t.classList.contains('tab'))return go(t.dataset.v);
 if(t.id==='fab')return openAdd();
 const a=t.dataset.a;
 if(a==='recon')return openRecon();
 if(a==='incgot')return receiveIncome(t.dataset.id);
 if(a&&a.startsWith('add-'))return editItem(a.slice(4));
 if(t.dataset.ed)return editItem(t.dataset.ed,t.dataset.id);
 if(t.dataset.set)return editSetting(t.dataset.set);
 if(t.dataset.tx){const x=allTx().find(y=>y.id===t.dataset.tx);if(x)openAdd(x);return}
 if(t.dataset.mo){listMonth=t.dataset.mo;document.querySelectorAll('[data-mo]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mo===listMonth));return listRes()}
 if(a==='bkf')return backupFile();if(a==='hideinst'){S.hideInstall=1;touch(['settings']);return render()}
 if(a==='bk')return backup();if(a==='rs')return restore();if(a==='wipe')return wipe();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.setup&&mode!=='init'){housekeep();render()}});
window.__kis={get S(){return S},get M(){return M},compute,get mode(){return mode}};
connect();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
