<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>האפליקציות שלי</title>
<link rel="icon" href="kis/icons/icon-192.png">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#0c0e0d);--ink:light-dark(#0e1110,#f1f4f2);--mute:light-dark(#5b645f,#9ca59f);--card:light-dark(#f3f6f4,#161a18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 20px}
h1{font-size:34px;line-height:1.1;margin:0 0 8px}p{color:var(--mute);margin:0 0 28px}
a.app{display:flex;gap:16px;align-items:center;padding:16px;border-radius:20px;background:var(--card);color:inherit;text-decoration:none}
a.app img{width:64px;height:64px;border-radius:16px}a.app b{display:block;font-size:19px}a.app span{color:var(--mute);font-size:15px}
</style>
</head>
<body>
<main>
<h1>האפליקציות שלי</h1>
<p>אפליקציות אישיות שמותקנות למסך הבית. הנתונים נשמרים רק בטלפון.</p>
<a class="app" href="kis/"><img src="kis/icons/icon-192.png" alt=""><div><b>כיס</b><span>כמה מותר להוציא היום</span></div></a>
</main>
</body>
</html>
